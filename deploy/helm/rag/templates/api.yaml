{{ include "rag.apiDeployment" (dict "root" . "variant" "stable" "cfg" .Values.stable) }}
{{- if .Values.canary.enabled }}
---
{{ include "rag.apiDeployment" (dict "root" . "variant" "canary" "cfg" .Values.canary) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api   # no variant label here: stable and canary pods share the traffic
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
