# One node is enough for this demo. NodePorts 30080 (API), 30300 (Grafana) and 30090 (Prometheus) are exposed on localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rag
nodes:
  - role: control-plane
    # 1.34: newer kubelets refuse cgroup v1, which older Docker Desktop / WSL kernels still use.
    image: kindest/node:v1.34.0
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
      - containerPort: 30300
        hostPort: 30300
      - containerPort: 30090
        hostPort: 30090
