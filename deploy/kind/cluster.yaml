# One node is enough for this demo. NodePorts 30080 (API) and 30300 (Grafana) are exposed on localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rag
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
      - containerPort: 30300
        hostPort: 30300
