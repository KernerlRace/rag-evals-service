# Local stack: Postgres + pgvector, a one-shot ingestion job, and the API.
# The LLM runs on the host (Ollama on the GPU); containers reach it via host.docker.internal.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 3s
      retries: 20

  ingest:
    build: .
    image: rag-evals-service:latest
    command: ["python", "-m", "ragsvc.ingest", "--sizes", "256", "--postgres"]
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
    volumes: ["./data/index:/app/data/index"]  # reuse embeddings already computed on the host
    depends_on:
      db: {condition: service_healthy}

  api:
    image: rag-evals-service:latest
    environment:
      RAG_STORE: postgres
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      RAG_RETRIEVER: ${RAG_RETRIEVER:-hybrid}
      RAG_LLM_BACKEND: ${RAG_LLM_BACKEND:-ollama}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ingest: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      start_period: 30s

volumes:
  pgdata:
